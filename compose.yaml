services:
  api:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://amrutam:amrutam-local-only@postgres:5432/amrutam
      REDIS_URL: redis://redis:6379/0
      TRUSTED_HOSTS: localhost,127.0.0.1,api
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  migrate:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://amrutam:amrutam-local-only@postgres:5432/amrutam
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amrutam
      POSTGRES_USER: amrutam
      POSTGRES_PASSWORD: amrutam-local-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amrutam -d amrutam"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
