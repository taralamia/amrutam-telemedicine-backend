[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amrutam-telemedicine-backend"
version = "0.1.0"
description = "Amrutam telemedicine backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.0,<7.0",
  "alembic>=1.13,<2.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "pyotp>=2.9,<3.0",
  "cryptography>=43.0,<46.0",
  "email-validator>=2.2,<3.0",
  "pydantic-settings>=2.5,<3.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.6,<1.0",
  "pytest-cov>=5.0,<7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
